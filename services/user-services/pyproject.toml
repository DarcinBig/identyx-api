[project]
name = "user-services"
version = "0.1.5"
description = "Identyx — User Management Service"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.136.1",
    "httpx>=0.28.1",
    "prometheus-client>=0.25.0",
    "psycopg[binary]>=3.3.4",
    "python-json-logger>=4.1.0",
    "sqlalchemy>=2.0.49",
]

[tool.uv]

[dependency-groups]
dev = [
    "ruff>=0.15.20",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
