[project]
name = "email-services"
version = "0.1.5"
description = "Identyx — Email Service"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiokafka>=0.14.0",
    "aiosmtplib>=5.1.0",
    "fastapi[standard]>=0.136.1",
    "jinja2>=3.1.6",
    "prometheus-client>=0.25.0",
    "python-json-logger>=4.1.0",
    "redis>=8.0.0",
]

[tool.uv]

[dependency-groups]
dev = [
    "ruff>=0.15.20",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
