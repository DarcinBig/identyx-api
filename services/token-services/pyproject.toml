[project]
name = "token-services"
version = "0.1.0"
description = "Identyx — Token Service"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fakeredis>=2.36.2",
    "fastapi[standard]>=0.136.1",
    "prometheus-client>=0.25.0",
    "python-jose[cryptography]>=3.5.0",
    "python-json-logger>=4.1.0",
    "redis>=7.4.0",
]

[tool.uv]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "fakeredis>=2.36.2",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
