name: CI

on:
  push:
    branches: [main, dev]
    # Add to manage versioning manually
    tags:
      - 'v*'
  pull_request:
    branches: [main, dev]

permissions:
  packages: write
  contents: read

jobs:

  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - gateway
          - services/auth-services
          - services/user-services
          - services/token-services
          - services/session-services
          - services/email-services

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: uv sync --dev

      - name: Lint with ruff
        working-directory: ${{ matrix.service }}
        run: uv run ruff check . --output-format=github
        continue-on-error: true

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: uv run pytest tests/ -v --tb=short
        if: ${{ hashFiles(format('{0}/tests/**', matrix.service)) != '' }}

  build-images:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        service:
          - name: gateway
            context: ./gateway
          - name: auth-service
            context: ./services/auth-services
          - name: user-service
            context: ./services/user-services
          - name: token-service
            context: ./services/token-services
          - name: session-service
            context: ./services/session-services
          - name: email-service
            context: ./services/email-services

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/identyx-${{ matrix.service.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/identyx-${{ matrix.service.name }}:latest
            ghcr.io/${{ github.repository_owner }}/identyx-${{ matrix.service.name }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max