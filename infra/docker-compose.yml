# version: "3.9"

services:

  # ─────────────────────────────────────────────
  # GATEWAY — Single entry point, port 8100
  # ─────────────────────────────────────────────
  gateway:
    build:
      context: ../gateway
      dockerfile: Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8100", "--reload"]
    container_name: identyx-gateway
    ports:
      - "8100:8100"
    env_file: ../.env
    environment:
      USER_SERVICE_URL: http://user-service:8001
      AUTH_SERVICE_URL: http://auth-service:8002
      TOKEN_SERVICE_URL: http://token-service:8003
      SESSION_SERVICE_URL: http://session-service:8004
      EMAIL_SERVICE_URL: http://email-service:8005

      RATE_LIMIT_REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/2"
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      session-service:
        condition: service_healthy
      token-service:
        condition: service_healthy
      email-service:
        condition: service_healthy
    networks:
      - identyx-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ─────────────────────────────────────────────
  # AUTH SERVICE — Register / Login / Logout
  # ─────────────────────────────────────────────
  auth-service:
    build:
      context: ../services/auth-services
      dockerfile: Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8002", "--reload"]
    dns:
      - 8.8.8.8
      - 8.8.4.4
    container_name: identyx-auth
#    ports:
#      - "8002:8002"
    env_file: ../.env
    environment:
#      DATABASE_URL: postgresql://identyx:${POSTGRES_PASSWORD}@postgres-auth:5432/identyx_auth
      POSTGRES_HOST: postgres-auth
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: identyx_auth
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      BRUTE_FORCE_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    depends_on:
      postgres-auth:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    networks:
      - identyx-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8002/health" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ─────────────────────────────────────────────
  # USER SERVICE — User profiles
  # ─────────────────────────────────────────────
  user-service:
    build:
      context: ../services/user-services
      dockerfile: Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]
    dns:
      - 8.8.8.8
      - 8.8.4.4
    container_name: identyx-users
#    ports:
#      - "8001:8001"
    env_file: ../.env
    environment:
#      DATABASE_URL: postgresql://identyx:${POSTGRES_PASSWORD}@postgres-users:5432/identyx_users
      POSTGRES_HOST: postgres-users
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: identyx_users
    depends_on:
      postgres-users:
        condition: service_healthy
    networks:
      - identyx-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/health" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ─────────────────────────────────────────────
  # SESSION SERVICE — Sessions and refresh tokens
  # ─────────────────────────────────────────────
  session-service:
    build:
      context: ../services/session-services
      dockerfile: Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8004", "--reload"]
    dns:
      - 8.8.8.8
      - 8.8.4.4
    container_name: identyx-sessions
#    ports:
#      - "8004:8004"
    env_file: ../.env
    environment:
#      DATABASE_URL: postgresql://identyx:${POSTGRES_PASSWORD}@postgres-sessions:5432/identyx_sessions
      POSTGRES_HOST: postgres-sessions
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: identyx_sessions
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/${REDIS_DB}
    depends_on:
      postgres-sessions:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - identyx-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8004/health" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ─────────────────────────────────────────────
  # TOKEN SERVICE — JWT generation / validation
  # ─────────────────────────────────────────────
  token-service:
    build:
      context: ../services/token-services
      dockerfile: Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8003", "--reload"]
    dns:
      - 8.8.8.8
      - 8.8.4.4
    container_name: identyx-tokens
#    ports:
#      - "8003:8003"
    env_file: ../.env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/${REDIS_DB}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - identyx-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8003/health" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ─────────────────────────────────────────────
  # EMAIL SERVICE — Sending emails
  # ─────────────────────────────────────────────
  email-service:
    build:
      context: ../services/email-services
      dockerfile: Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8005", "--reload"]
    dns:
      - 8.8.8.8
      - 8.8.4.4
    container_name: identyx-emails
#    ports:
#      - "8005:8005"
    env_file: ../.env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    depends_on:
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    networks:
      - identyx-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8005/health" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ─────────────────────────────────────────────
  # PROMETHEUS — Metrics
  # ─────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: identyx-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheusdata:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    networks:
      - identyx-network
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # DATABASES — One instance per service
  # ─────────────────────────────────────────────
  postgres-auth:
    image: postgres:16-alpine
    container_name: identyx-db-auth
    environment:
      POSTGRES_USER: identyx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: identyx_auth
    volumes:
      - pgdata-auth:/var/lib/postgresql/data
    networks:
      - identyx-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identyx -d identyx_auth"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres-users:
    image: postgres:16-alpine
    container_name: identyx-db-users
    environment:
      POSTGRES_USER: identyx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: identyx_users
    volumes:
      - pgdata-users:/var/lib/postgresql/data
    networks:
      - identyx-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identyx -d identyx_users"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres-sessions:
    image: postgres:16-alpine
    container_name: identyx-db-sessions
    environment:
      POSTGRES_USER: identyx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: identyx_sessions
    volumes:
      - pgdata-sessions:/var/lib/postgresql/data
    networks:
      - identyx-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identyx -d identyx_sessions"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # REDIS — Cache, sessions, rate limiting
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: identyx-redis
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
      - redisdata:/data
#    ports:
#      - "63790:6379"  # 63790 exposes Redis on my host.
    networks:
      - identyx-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # REDPANDA — Kafka-compatible message broker
  # Replaces Redis Pub/Sub for inter-service events.
  # Standard Kafka interface — no ZooKeeper required
  # ─────────────────────────────────────────────
  redpanda:
    image: redpandadata/redpanda:v24.1.1
    container_name: identyx-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --smp 1
      - --memory 512M
      - --mode dev-container
      - --default-log-level=warn
    ports:
      - "19092:19092"     # External Kafka API (local dev)
      - "18082:18082"     # External pandaproxy (local dev)
      - "18081:18081"     # External Schema Registry (local dev)
    volumes:
      - redpandadata:/var/lib/redpanda/data
    networks:
      - identyx-network
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Redpanda Console — Topic monitoring UI (optional)
  redpanda-console:
    image: redpandadata/console:v2.5.2
    container_name: identyx-redpanda-console
    ports:
      - "8180:8080"     # http://localhost:8180 to view the topics
    environment:
      KAFKA_BROKERS: redpanda:9092
    networks:
      - identyx-network
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped

# ─────────────────────────────────────────────
# VOLUMES persistent
# ─────────────────────────────────────────────
volumes:
  pgdata-auth:
  pgdata-users:
  pgdata-sessions:
  redisdata:
  prometheusdata:
  redpandadata:

# ─────────────────────────────────────────────
# NETWORK internal insulated
# ─────────────────────────────────────────────
networks:
  identyx-network:
    driver: bridge