# Persistence RDB (Redis DB)
save 900 1
save 300 10
save 60 10000

# Persistence AOF (Append Only File)
appendonly yes
appendfsync everysec

# Memory
maxmemory 256mb
maxmemory-policy allkeys-lru

# Security
protected-mode yes
# NOTE: The password is injected at runtime via docker-compose:
#   redis-server ... --requirepass ${REDIS_PASSWORD}
# It must never be hardcoded here.

# Logs
loglevel notice