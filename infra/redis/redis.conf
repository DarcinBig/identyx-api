# Persistence RDB (Redis DB)
save 900 1
save 300 10
save 60 10000

# Persistence AOF (Append Only File)
appendonly yes
appendfsync everysec

# Memory
maxmemory 256mb
maxmemory-policy allkeys-lru

# Security
protected-mode yes
# Uncomment in production:
# requirepass your_redis_password

# Logs
loglevel notice