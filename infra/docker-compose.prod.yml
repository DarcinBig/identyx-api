# Usage (pull pre-built images):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Usage (build locally):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml build
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Override the image tag with IMAGE_TAG env var (default: latest):
#   IMAGE_TAG=v0.1.5 docker compose -f docker-compose.yml -f docker-compose.prod.yml pull

services:

  gateway:
    image: ghcr.io/darcinbig/identyx-gateway:${IMAGE_TAG:-latest}
    build:
      context: ../gateway
      dockerfile: Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8100", "--workers", "2"]
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  auth-service:
    image: ghcr.io/darcinbig/identyx-auth-service:${IMAGE_TAG:-latest}
