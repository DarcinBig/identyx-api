[project]
name = "gateway"
version = "1.1.2"
description = "Identyx — API Gateway: single entry point with rate limiting, JWT validation, routing and observability"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.136.1",
    "httpx>=0.28.1",
    "opentelemetry-api>=1.30.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30.0",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "opentelemetry-instrumentation-httpx>=0.51b0",
    "opentelemetry-sdk>=1.30.0",
    "prometheus-client>=0.25.0",
    "pydantic-settings>=2.14.1",
    "python-json-logger>=4.1.0",
    "redis>=7.4.0",
]

[tool.uv]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "fakeredis>=2.36.2",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
